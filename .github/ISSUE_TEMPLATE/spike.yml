# Installed by Ahrena: ahrena-contributing, skills/installing-issue-forms.
# New in Ahrena; the predecessor framework had no spike. The sections map to the
# issue-quality rule, and `Acceptance criteria` is what the traceability check reads.
name: "Spike"
description: "A timeboxed question that must be answered before the work that depends on it can be planned or built"
title: "{{ the question, ending in a question mark }}"
type: Spike
labels:
  - "status: to refinement"

body:
  - type: markdown
    attributes:
      value: |
        Use this template when something is not known well enough to plan or build: whether an approach works, what a system can take, which option to pick.
        A spike produces a decision, not a feature. It is timeboxed, and it blocks every item that waits on its answer.
        Per Ahrena's `issue-quality` rule, every issue states why, what done looks like, and what it leaves to other issues.

  - type: textarea
    id: question
    attributes:
      label: "Question"
      description: "The one question this spike answers. If there are two, it is two spikes."
      placeholder: "e.g. Can the ledger take 5,000 writes a second on the current schema?"
    validations:
      required: true

  - type: textarea
    id: why_it_blocks
    attributes:
      label: "Why it blocks"
      description: "What cannot be planned, estimated or built until this is answered, each by number. Those items are blocked by this spike."
      placeholder: "e.g. #140 (partition the ledger) and #141 (bulk import) both depend on the answer."
    validations:
      required: true

  - type: input
    id: timebox
    attributes:
      label: "Timebox"
      description: "The most time the answer is worth. When it runs out, the decision is taken on what is known by then."
      placeholder: "e.g. 2 days"
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: "Approach"
      description: "How the question will be answered: the measurement, the prototype, the documentation to read, the people to ask."
      placeholder: "e.g. Load-test a copy of the schema with the production write mix, at 1k, 5k and 10k writes a second."
    validations:
      required: false

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "Acceptance criteria"
      description: "A spike's criteria are judged by a reader, because what it produces is a decision, not code."
      value: |
        - AC-1: The question is answered, with the evidence that answers it. (checked by review)
        - AC-2: The decision is recorded, as a decision record when it will be questioned later, or as a comment here when it will not. (checked by review)
        - AC-3: The items it blocked are updated, or new ones opened, to match the answer. (checked by review)
    validations:
      required: true

  - type: textarea
    id: left_to_other_issues
    attributes:
      label: "Left to other issues"
      description: "The work this spike informs but does not do, each by number."
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        > A spike's code is thrown away, or rewritten under its own issue. Nothing it produces lands on trunk as a feature.
