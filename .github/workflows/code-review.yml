name: Code Review (Argos)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: argos-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Login como o App Argos → token de instalação (a "cara" nos comentários).
      - name: Login como Argos
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ARGOS_APP_ID }}
          private-key: ${{ secrets.ARGOS_APP_PRIVATE_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instala
        run: npm ci

      # Gates decididos pelo pipeline (não pelo agente) — viram fato pro Argos.
      - name: Gates (tsc + audit)
        run: |
          if npm run typecheck >/dev/null 2>&1; then TSC="OK (0 erros)"; else TSC="FALHOU"; fi
          AUDIT=$(npm audit --json 2>/dev/null | jq -r '.metadata.vulnerabilities | "critical \(.critical), high \(.high), moderate \(.moderate), low \(.low)"' 2>/dev/null || echo "indisponivel")
          {
            echo "- tsc --noEmit: $TSC"
            echo "- npm audit: $AUDIT"
          } > gates.md
          cat gates.md

      - name: Argos conduz a review
        id: argos
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npx tsx src/cli.ts \
            --pr "${{ github.event.pull_request.number }}" \
            --changed "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            --gates gates.md \
            > review.json 2> review.log || true
          cat review.log >&2
          VERDICT=$(jq -r '.verdict // "comment"' review.json)
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          {
            echo "<!-- ahrena-review -->"
            echo "**Verdict:** \`$VERDICT\`"
            echo
            jq -r '.summary // "(sem review)"' review.json
          } > comment.md

      - name: Posta o verdict como argos[bot]
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
