name: Release

# Continuous release: empurrar uma tag semver (vX.Y.Z) roda o gate e, se passar,
# publica npm + imagem Docker multi-arch + GitHub Release. Sem passo manual.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # criar o GitHub Release
  packages: write # ghcr (imagem) + GitHub Packages (npm)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # TODO (dogfood SUP-1): fixar as actions por commit SHA em vez de tag.
      - uses: actions/checkout@v4
        with:
          submodules: recursive # o framework vai baked na imagem/no pacote

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instala
        run: npm ci

      # --- Gate: só publica se passar ---
      - name: Typecheck
        run: npm run typecheck
      # - name: Testes
      #   run: npm test   # entra aqui quando houver suíte

      # --- Alinha a versão do package.json com a tag ---
      - name: Versão a partir da tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # --- Publica o pacote npm (GitHub Packages) ---
      - name: Publica npm (idempotente)
        run: npm publish || echo "npm: versão já publicada; seguindo para a imagem e o release"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Publica a imagem Docker multi-arch ---
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ahrenatechnology/ahrena-agents:${{ github.ref_name }}
            ghcr.io/ahrenatechnology/ahrena-agents:v1
            ghcr.io/ahrenatechnology/ahrena-agents:latest

      # --- GitHub Release com notas automáticas ---
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
