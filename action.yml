name: "Ahrena Agents"
description: "An AI development squad for your pipeline — a stack of dev agents from Ahrena. First agent in the squad: code review (Argos). More joining soon."
author: "Ahrena"
branding:
  icon: "eye"
  color: "purple"

inputs:
  claude-token:
    description: "Token do Claude Code (claude setup-token) ou ANTHROPIC_API_KEY."
    required: true
  argos-model:
    description: "Modelo do Argos. Vazio → default da plataforma (claude-opus-4-8)."
    required: false
  cloudflare-account-id:
    description: "Account ID da Cloudflare (Workers AI) para o Decisor (Clef)."
    required: false
  cloudflare-api-token:
    description: "API token da Cloudflare com escopo Workers AI, para o Decisor."
    required: false
  clef-model:
    description: "Modelo de decisão (provider cloudflare). Vazio → default (clef). Ex.: clef-flash."
    required: false
  decisor-provider:
    description: "Provider do Decisor: cloudflare (default) ou bedrock."
    required: false
  bedrock-model:
    description: "Id do modelo Bedrock (quando decisor-provider=bedrock). Ex.: um Claude no Bedrock."
    required: false
  aws-region:
    description: "Região AWS do Bedrock (quando decisor-provider=bedrock)."
    required: false
  aws-access-key-id:
    description: "AWS access key id p/ o Bedrock (ou use OIDC/role no job). Opcional."
    required: false
  aws-secret-access-key:
    description: "AWS secret access key p/ o Bedrock. Opcional."
    required: false
  aws-session-token:
    description: "AWS session token (credenciais temporárias). Opcional."
    required: false
  auto-merge-min:
    description: "Limiar do gate: prob. mínima de auto_merge (0–1). Vazio → default (0.85)."
    required: false
  regression-max:
    description: "Limiar do gate: prob. máxima de regressão tolerada (0–1). Vazio → default (0.15)."
    required: false
  max-warnings:
    description: "Pré-gate: máximo de warnings que ainda vai ao Clef; acima disso delega. Vazio → default (2)."
    required: false
  checks-file:
    description: "Arquivo JSON com as checagens determinísticas (array de {name, conclusion}, ou toJSON(needs)). Vazio → lê o commit do PR pela API do GitHub."
    required: false
  checks-wait:
    description: "Segundos que o Argos espera as outras checagens do commit terminarem. Vazio → default (900)."
    required: false
  checks-exclude:
    description: "Regex dos nomes de checagens a ignorar. As da própria execução do Argos já saem sozinhas."
    required: false

runs:
  using: "docker"
  image: "docker://ghcr.io/ahrenatechnology/ahrena-agents:v1"
  env:
    CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-token }}
    GH_TOKEN: ${{ github.token }}
    ARGOS_MODEL: ${{ inputs.argos-model }}
    CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
    CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
    CLEF_MODEL: ${{ inputs.clef-model }}
    DECISOR_PROVIDER: ${{ inputs.decisor-provider }}
    BEDROCK_MODEL: ${{ inputs.bedrock-model }}
    AWS_REGION: ${{ inputs.aws-region }}
    AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
    AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
    AWS_SESSION_TOKEN: ${{ inputs.aws-session-token }}
    DECISOR_AUTO_MERGE_MIN: ${{ inputs.auto-merge-min }}
    DECISOR_REGRESSION_MAX: ${{ inputs.regression-max }}
    DECISOR_MAX_WARNINGS: ${{ inputs.max-warnings }}
    ARGOS_CHECKS_FILE: ${{ inputs.checks-file }}
    ARGOS_CHECKS_WAIT: ${{ inputs.checks-wait }}
    ARGOS_CHECKS_EXCLUDE: ${{ inputs.checks-exclude }}
  args:
    - "--pr"
    - ${{ github.event.pull_request.number }}
    - "--changed"
    - "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
