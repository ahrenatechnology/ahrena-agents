name: "Ahrena Agents"
description: "Ahrena's AI agent suite for your pipeline. Now: code review (Argos) — checks your PR against engineering & security rules, read-only. More agents coming."
author: "Ahrena"
branding:
  icon: "eye"
  color: "purple"

inputs:
  claude-token:
    description: "Token do Claude Code (claude setup-token) ou ANTHROPIC_API_KEY."
    required: true

runs:
  using: "docker"
  image: "docker://ghcr.io/ahrenatechnology/ahrena-agents:v1"
  env:
    CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-token }}
    GH_TOKEN: ${{ github.token }}
  args:
    - "--pr"
    - ${{ github.event.pull_request.number }}
    - "--changed"
    - "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
