name: "Ahrena Code Review"
description: "AI pull-request review by the Argos agent: checks your diff against engineering and security rules and reports a verdict. Read-only — it reviews the code, never runs your app."
author: "Ahrena"
branding:
  icon: "eye"
  color: "purple"

inputs:
  claude-token:
    description: "Token do Claude Code (claude setup-token) ou ANTHROPIC_API_KEY."
    required: true

runs:
  using: "docker"
  image: "docker://ghcr.io/ahrenatechnology/ahrena-agents:v1"
  env:
    CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-token }}
    GH_TOKEN: ${{ github.token }}
  args:
    - "--pr"
    - ${{ github.event.pull_request.number }}
    - "--changed"
    - "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
